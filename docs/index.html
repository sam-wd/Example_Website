<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08000f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #c { display: block; border-radius: 16px; cursor: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const cv = document.getElementById('c');
    const cx = cv.getContext('2d');
    const SIZE = 500;
    cv.width = SIZE;
    cv.height = SIZE;
    cv.style.width  = Math.min(SIZE, window.innerWidth - 32) + 'px';
    cv.style.height = cv.style.width;

    const W = SIZE, H = SIZE;
    const mouse = { x: -999, y: -999 };

    cv.addEventListener('mousemove', e => {
      const r = cv.getBoundingClientRect();
      const scl = SIZE / r.width;
      mouse.x = (e.clientX - r.left) * scl;
      mouse.y = (e.clientY - r.top)  * scl;
    });
    cv.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

    function heartContains(hx, hy, s, px, py) {
      const dx = (px - hx) / s, dy = (py - (hy - s * 0.1)) / s;
      return (dx*dx + dy*dy - 1)**3 - dx*dx*dy*dy*dy < 0;
    }

    class Particle {
      constructor(x, y, col) {
        this.x = x; this.y = y; this.col = col;
        const a = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 3.5;
        this.vx = Math.cos(a) * spd;
        this.vy = Math.sin(a) * spd - 2;
        this.r = 2 + Math.random() * 4;
        this.life = 1;
        this.decay = 0.018 + Math.random() * 0.025;
        this.isHeart = Math.random() < 0.35;
        this.rot = Math.random() * Math.PI * 2;
        this.rotV = (Math.random() - 0.5) * 0.15;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += 0.07; this.vx *= 0.97;
        this.life -= this.decay;
        this.rot += this.rotV;
      }
      draw() {
        if (this.life <= 0) return;
        cx.save();
        cx.globalAlpha = Math.max(0, this.life);
        if (this.isHeart) {
          cx.translate(this.x, this.y); cx.rotate(this.rot); cx.translate(-this.x, -this.y);
          const s = this.r * 1.2;
          cx.beginPath();
          cx.moveTo(this.x, this.y + s*0.35);
          cx.bezierCurveTo(this.x, this.y+s*0.1, this.x-s, this.y+s*0.05, this.x-s, this.y+s*0.45);
          cx.bezierCurveTo(this.x-s, this.y+s*0.9, this.x, this.y+s*1.2, this.x, this.y+s*1.45);
          cx.bezierCurveTo(this.x, this.y+s*1.2, this.x+s, this.y+s*0.9, this.x+s, this.y+s*0.45);
          cx.bezierCurveTo(this.x+s, this.y+s*0.05, this.x, this.y+s*0.1, this.x, this.y+s*0.35);
          cx.fillStyle = this.col; cx.fill();
        } else {
          cx.beginPath(); cx.arc(this.x, this.y, this.r, 0, Math.PI*2);
          cx.fillStyle = this.col; cx.fill();
        }
        cx.restore();
      }
    }

    const PALETTES = ['#ff4466','#ff6b8a','#ff99bb','#ff88cc','#cc44ff','#ffdd44','#ff7755','#44bbff'];
    let particles = [], spawnTimer = 0;

    const heart = {
      x: W/2, y: H/2,
      s: W * 0.3,
      wobX: 0, wobY: 0,
      rot: 0, rotTarget: 0,
      scale: 1, scaleTarget: 1,
      squish: 1, squishTarget: 1,
      hovered: false,
      beatPhase: 0,
      blinkTimer: 0, blinking: false, blinkAmt: 0,
    };

    function drawHeart(x, y, s, col, col2) {
      cx.save();
      cx.translate(x, y); cx.rotate(heart.rot);
      cx.scale(1, heart.squish);
      cx.translate(-x, -y);

      cx.beginPath();
      cx.moveTo(x, y+s*0.35);
      cx.bezierCurveTo(x, y+s*0.1, x-s, y+s*0.05, x-s, y+s*0.45);
      cx.bezierCurveTo(x-s, y+s*0.9, x, y+s*1.2, x, y+s*1.45);
      cx.bezierCurveTo(x, y+s*1.2, x+s, y+s*0.9, x+s, y+s*0.45);
      cx.bezierCurveTo(x+s, y+s*0.05, x, y+s*0.1, x, y+s*0.35);

      const grd = cx.createRadialGradient(x-s*0.2, y-s*0.1, s*0.1, x, y+s*0.6, s*1.5);
      grd.addColorStop(0, col2); grd.addColorStop(1, col);
      cx.fillStyle = grd; cx.fill();

      cx.globalAlpha = 0.18;
      cx.strokeStyle = '#ffffff'; cx.lineWidth = s*0.04; cx.stroke();

      cx.globalAlpha = 0.55;
      cx.fillStyle = 'rgba(255,255,255,0.55)';
      cx.beginPath(); cx.ellipse(x-s*0.38, y-s*0.15, s*0.28, s*0.16, -0.55, 0, Math.PI*2); cx.fill();
      cx.beginPath(); cx.ellipse(x-s*0.6,  y+s*0.15, s*0.1,  s*0.07, -0.4,  0, Math.PI*2); cx.fill();

      if (heart.hovered) {
        const blink = heart.blinkAmt;
        const eyeY  = y + s*0.38;
        [-1, 1].forEach(side => {
          const ex = x + side * s*0.28;
          cx.globalAlpha = 1;
          cx.fillStyle = '#fff';
          cx.beginPath(); cx.ellipse(ex, eyeY, s*0.11, s*0.11*(1-blink*0.95), 0, 0, Math.PI*2); cx.fill();
          cx.fillStyle = '#1a0010';
          cx.beginPath(); cx.ellipse(ex+side*s*0.025, eyeY, s*0.06, s*0.07*(1-blink*0.95), 0, 0, Math.PI*2); cx.fill();
          cx.fillStyle = '#fff';
          cx.beginPath(); cx.ellipse(ex+side*s*0.05, eyeY-s*0.025, s*0.02, s*0.02*(1-blink*0.95), 0, 0, Math.PI*2); cx.fill();
        });
        const smileY = y + s*0.75;
        cx.globalAlpha = 0.9;
        cx.strokeStyle = '#7a0030'; cx.lineWidth = s*0.04; cx.lineCap = 'round';
        cx.beginPath();
        cx.moveTo(x-s*0.22, smileY);
        cx.bezierCurveTo(x-s*0.1, smileY+s*0.15, x+s*0.1, smileY+s*0.15, x+s*0.22, smileY);
        cx.stroke();
        cx.globalAlpha = 0.5;
        cx.fillStyle = '#ff6699';
        cx.beginPath(); cx.ellipse(x-s*0.48, smileY-s*0.08, s*0.13, s*0.09, 0, 0, Math.PI*2); cx.fill();
        cx.beginPath(); cx.ellipse(x+s*0.48, smileY-s*0.08, s*0.13, s*0.09, 0, 0, Math.PI*2); cx.fill();
      }
      cx.restore();
    }

    let hue = 0, t = 0;

    function loop() {
      cx.clearRect(0, 0, W, H);
      const bgGrd = cx.createLinearGradient(0, 0, 0, H);
      bgGrd.addColorStop(0, '#08000f'); bgGrd.addColorStop(1, '#18001f');
      cx.fillStyle = bgGrd; cx.fillRect(0, 0, W, H);

      t++;
      heart.beatPhase += heart.hovered ? 0.12 : 0.06;
      const beat = Math.max(0, Math.sin(heart.beatPhase)) * (heart.hovered ? 0.14 : 0.06);

      const inHeart = heartContains(heart.x, heart.y - heart.s*0.05, heart.s, mouse.x, mouse.y);
      heart.hovered = inHeart;

      if (inHeart) {
        const dx = mouse.x - heart.x, dy = mouse.y - heart.y;
        heart.wobX += (dx*0.22 - heart.wobX) * 0.1;
        heart.wobY += (dy*0.22 - heart.wobY) * 0.1;
        heart.rotTarget    = dx * 0.0015;
        heart.squishTarget = 1 + Math.sin(t*0.18)*0.06;
        heart.scaleTarget  = 1.08 + beat;
        hue = (hue + 0.5) % 360;

        heart.blinkTimer++;
        if (heart.blinkTimer > 90 && !heart.blinking) { heart.blinking = true; heart.blinkTimer = 0; }
        if (heart.blinking) {
          heart.blinkAmt = Math.min(1, heart.blinkAmt + 0.15);
          if (heart.blinkAmt >= 1) heart.blinkAmt = Math.max(0, heart.blinkAmt - 0.15);
          if (heart.blinkAmt <= 0) { heart.blinking = false; heart.blinkAmt = 0; }
        }

        spawnTimer++;
        if (spawnTimer > 4 && particles.length < 120) {
          spawnTimer = 0;
          const angle = Math.random() * Math.PI * 2;
          const r2 = heart.s * (0.6 + Math.random() * 0.5);
          particles.push(new Particle(
            heart.x + heart.wobX + Math.cos(angle) * r2,
            heart.y + heart.wobY + Math.sin(angle) * r2 * 0.75,
            PALETTES[Math.floor(Math.random() * PALETTES.length)]
          ));
        }
      } else {
        heart.wobX += (0 - heart.wobX) * 0.08;
        heart.wobY += (0 - heart.wobY) * 0.08;
        heart.rotTarget    = 0;
        heart.squishTarget = 1 + beat*0.5;
        heart.scaleTarget  = 1 + beat;
        heart.blinkAmt = 0; heart.blinking = false; heart.blinkTimer = 0;
        spawnTimer = 0;
      }

      heart.rot    += (heart.rotTarget    - heart.rot)    * 0.08;
      heart.scale  += (heart.scaleTarget  - heart.scale)  * 0.1;
      heart.squish += (heart.squishTarget - heart.squish) * 0.12;

      const dx  = heart.x + heart.wobX;
      const dy  = heart.y + heart.wobY;
      const ds  = heart.s * heart.scale;
      const col  = heart.hovered ? `hsl(${hue},90%,55%)`         : '#e82050';
      const col2 = heart.hovered ? `hsl(${(hue+40)%360},90%,78%)` : '#ff6b8a';

      cx.save();
      cx.globalAlpha = 0.1;
      cx.beginPath(); cx.arc(dx, dy+ds*0.4, ds*1.1, 0, Math.PI*2);
      cx.fillStyle = col; cx.fill();
      cx.restore();

      for (let i = particles.length-1; i >= 0; i--) {
        particles[i].update(); particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      drawHeart(dx, dy, ds, col, col2);

      if (!heart.hovered && mouse.x > 0) {
        cx.save(); cx.globalAlpha = 0.6;
        cx.fillStyle = '#fff';
        cx.beginPath(); cx.arc(mouse.x, mouse.y, 3, 0, Math.PI*2); cx.fill();
        cx.restore();
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
